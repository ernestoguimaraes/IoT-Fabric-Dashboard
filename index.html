<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Factory Dashboard — 3D Monitoramento de Chão de Fábrica</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* HUD overlay */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(180deg, rgba(13,17,23,0.85) 0%, transparent 100%);
    }
    #hud h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #f0f6fc;
    }
    #hud h1 small {
      font-weight: 400;
      font-size: 13px;
      color: #8b949e;
      margin-left: 12px;
    }
    #hud .stats {
      display: flex;
      gap: 28px;
      font-size: 13px;
    }
    #hud .stats .stat {
      text-align: right;
    }
    #hud .stats .stat .label {
      color: #8b949e;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #hud .stats .stat .value {
      font-weight: 600;
      font-size: 15px;
    }
    .value.online { color: #3fb950; }
    .value.alert   { color: #d29922; }
    .value.offline { color: #f85149; }

    /* Machine info panel */
    #info-panel {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      max-width: 92vw;
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px 24px;
      z-index: 20;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 0;
      transform: translateX(-50%) translateY(8px);
    }
    #info-panel.visible {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #info-panel .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    #info-panel .header h2 {
      font-size: 17px;
      font-weight: 600;
    }
    #info-panel .header .status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .status-badge.online  { background: rgba(63,185,80,0.15); color: #3fb950; border: 1px solid rgba(63,185,80,0.3); }
    .status-badge.alert   { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid rgba(210,153,34,0.3); }
    .status-badge.offline { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.3); }

    #info-panel .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    #info-panel .metrics .metric {
      background: rgba(48,54,61,0.4);
      border-radius: 8px;
      padding: 10px 12px;
    }
    #info-panel .metrics .metric .m-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #8b949e;
      letter-spacing: 0.4px;
    }
    #info-panel .metrics .metric .m-value {
      font-size: 16px;
      font-weight: 600;
      margin-top: 2px;
    }

    #info-panel .command-area {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    #info-panel .command-area select {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    #info-panel .command-area select:focus {
      border-color: #58a6ff;
    }
    #info-panel .command-area button {
      background: #238636;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #info-panel .command-area button:hover {
      background: #2ea043;
    }
    #info-panel .command-area button:active {
      background: #1e7e34;
    }
    #info-panel .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
    #info-panel .close-btn:hover { color: #f0f6fc; }

    #toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(35,134,54,0.92);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }

    /* Legend */
    #legend {
      position: fixed;
      bottom: 32px;
      right: 24px;
      z-index: 10;
      font-size: 12px;
      color: #8b949e;
      text-align: right;
      line-height: 1.8;
      pointer-events: none;
    }
    #legend .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    #legend .dot.green  { background: #3fb950; }
    #legend .dot.yellow { background: #d29922; }
    #legend .dot.red    { background: #f85149; }
  </style>
</head>
<body>

<div id="hud">
  <h1>🏭 IoT Factory Floor <small>3D Monitoramento</small></h1>
  <div class="stats">
    <div class="stat"><div class="label">Online</div><div class="value online" id="stat-online">—</div></div>
    <div class="stat"><div class="label">Alerta</div><div class="value alert" id="stat-alert">—</div></div>
    <div class="stat"><div class="label">Offline</div><div class="value offline" id="stat-offline">—</div></div>
  </div>
</div>

<div id="info-panel">
  <button class="close-btn" id="panel-close">&times;</button>
  <div class="header">
    <h2 id="panel-name">Máquina</h2>
    <span class="status-badge" id="panel-status">Online</span>
  </div>
  <div class="metrics">
    <div class="metric"><div class="m-label">Temperatura</div><div class="m-value" id="panel-temp">—</div></div>
    <div class="metric"><div class="m-label">Vibração</div><div class="m-value" id="panel-vib">—</div></div>
    <div class="metric"><div class="m-label">Uso</div><div class="m-value" id="panel-usage">—</div></div>
  </div>
  <div class="command-area">
    <select id="cmd-select">
      <option value="">— Enviar comando —</option>
      <option value="EMERGENCY_STOP">🛑 EMERGENCY_STOP</option>
      <option value="PAUSE">⏸️ PAUSE</option>
      <option value="RESUME">▶️ RESUME</option>
      <option value="CALIBRATE">🔧 CALIBRATE</option>
      <option value="SPEED_UP">⚡ SPEED_UP</option>
      <option value="SLOW_DOWN">🐢 SLOW_DOWN</option>
      <option value="CYCLE_START">🔄 CYCLE_START</option>
    </select>
    <button id="cmd-send">Enviar</button>
  </div>
</div>

<div id="toast"></div>

<div id="legend">
  <div><span class="dot green"></span> Online</div>
  <div><span class="dot yellow"></span> Alerta</div>
  <div><span class="dot red"></span> Offline</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ─── Mock Data ───────────────────────────────────────────────────────────────

const MACHINES = [
  // CNC Machines
  { id: 'CNC-001', name: 'Torno CNC 1', type: 'cnc',     status: 'online',  pos: [-8, 0, -6], temp: 72, vib: 0.8, usage: 87, moving: false },
  { id: 'CNC-002', name: 'Torno CNC 2', type: 'cnc',     status: 'online',  pos: [-4, 0, -6], temp: 68, vib: 0.6, usage: 92, moving: false },
  { id: 'CNC-003', name: 'Fresa CNC 1', type: 'cnc',     status: 'alert',   pos: [ 0, 0, -6], temp: 89, vib: 1.4, usage: 76, moving: false },
  // Robotic Arms
  { id: 'ROB-001', name: 'Braço Robô A', type: 'robot',  status: 'online',  pos: [-6, 0, -2], temp: 55, vib: 0.3, usage: 64, moving: false },
  { id: 'ROB-002', name: 'Braço Robô B', type: 'robot',  status: 'online',  pos: [-2, 0, -2], temp: 52, vib: 0.4, usage: 71, moving: false },
  { id: 'ROB-003', name: 'Braço Robô C', type: 'robot',  status: 'offline', pos: [ 2, 0, -2], temp: 30, vib: 0.0, usage:  0, moving: false },
  // Conveyor belts (static visual)
  { id: 'CVY-001', name: 'Esteira 1',    type: 'conveyor',status: 'online',  pos: [-7, 0,  2], temp: 41, vib: 0.2, usage: 83, moving: false },
  { id: 'CVY-002', name: 'Esteira 2',    type: 'conveyor',status: 'online',  pos: [-3, 0,  2], temp: 39, vib: 0.2, usage: 79, moving: false },
  { id: 'CVY-003', name: 'Esteira 3',    type: 'conveyor',status: 'alert',   pos: [ 1, 0,  2], temp: 58, vib: 0.7, usage: 91, moving: false },
  // Forklifts (moving)
  { id: 'FKL-001', name: 'Empilhadeira 1', type: 'forklift', status: 'online',  pos: [-5, 0,  6], temp: 48, vib: 0.5, usage: 55, moving: true },
  { id: 'FKL-002', name: 'Empilhadeira 2', type: 'forklift', status: 'online',  pos: [ 3, 0,  6], temp: 51, vib: 0.6, usage: 62, moving: true },
  { id: 'FKL-003', name: 'Empilhadeira 3', type: 'forklift', status: 'alert',   pos: [ 7, 0,  6], temp: 66, vib: 1.1, usage: 78, moving: true },
  // Injection Molding
  { id: 'INJ-001', name: 'Injetora 1',   type: 'injector',status: 'online',  pos: [-6, 0, 10], temp: 185,vib: 0.9, usage: 94, moving: false },
  { id: 'INJ-002', name: 'Injetora 2',   type: 'injector',status: 'alert',   pos: [-2, 0, 10], temp: 210,vib: 1.3, usage: 88, moving: false },
  // Press
  { id: 'PRE-001', name: 'Prensa Hidráulica', type: 'press', status: 'online', pos: [ 4, 0, 10], temp: 62, vib: 2.1, usage: 45, moving: false },
  // Welding
  { id: 'WLD-001', name: 'Solda Robótica', type: 'welder', status: 'online', pos: [ 8, 0, 10], temp: 320,vib: 0.4, usage: 37, moving: false },
];

// ─── Scene Setup ─────────────────────────────────────────────────────────────

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 25, 45);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 80);
camera.position.set(14, 12, 18);
camera.lookAt(0, 0, 2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(container.clientWidth, container.clientHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 6;
controls.maxDistance = 35;
controls.update();

// ─── Lighting ────────────────────────────────────────────────────────────────

const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 2.2);
dirLight.position.set(12, 18, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 40;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
fillLight.position.set(-8, 6, -10);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x88ccff, 0.3);
rimLight.position.set(0, -4, -15);
scene.add(rimLight);

// ─── Floor ───────────────────────────────────────────────────────────────────

const floorGeo = new THREE.PlaneGeometry(28, 28);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x161b22,
  roughness: 0.7,
  metalness: 0.2,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, -0.05, 2);
floor.receiveShadow = true;
scene.add(floor);

// Grid
const gridHelper = new THREE.GridHelper(28, 28, 0x30363d, 0x21262d);
gridHelper.position.y = 0;
gridHelper.position.z = 2;
scene.add(gridHelper);

// ─── Factory Building (glass walls) ──────────────────────────────────────────

function createWall(w, h, pos, rotY = 0) {
  const geo = new THREE.PlaneGeometry(w, h);
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x1c2333,
    transparent: true,
    opacity: 0.15,
    roughness: 0.1,
    metalness: 0.3,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.rotation.y = rotY;
  scene.add(mesh);
}
createWall(18, 5, [0, 2.5, -8.5]);
createWall(18, 5, [0, 2.5, 12.5]);
createWall(20, 5, [-9.5, 2.5, 2], Math.PI / 2);
createWall(20, 5, [9.5, 2.5, 2], Math.PI / 2);

// ─── Machine Builders ────────────────────────────────────────────────────────

const machineMeshes = [];

function createLabel(text, yOffset = 1.6) {
  const div = document.createElement('div');
  div.textContent = text;
  div.style.color = '#8b949e';
  div.style.fontSize = '11px';
  div.style.fontWeight = '500';
  div.style.fontFamily = "'Segoe UI', system-ui, sans-serif";
  div.style.textShadow = '0 1px 4px rgba(0,0,0,0.8)';
  div.style.background = 'rgba(13,17,23,0.6)';
  div.style.padding = '2px 8px';
  div.style.borderRadius = '4px';
  div.style.backdropFilter = 'blur(4px)';
  div.style.pointerEvents = 'none';
  return new CSS2DObject(div);
}

function buildCNC(pos, data) {
  const group = new THREE.Group();
  // Base
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.3, 1.4),
    new THREE.MeshStandardMaterial({ color: 0x2d333b, roughness: 0.6, metalness: 0.3 })
  );
  base.position.y = 0.15;
  base.castShadow = true;
  group.add(base);
  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.8, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x3d444d, roughness: 0.5, metalness: 0.4 })
  );
  body.position.y = 0.7;
  body.castShadow = true;
  group.add(body);
  // Spindle
  const spindle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.15, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.3, metalness: 0.8 })
  );
  spindle.position.set(0, 1.15, 0.4);
  group.add(spindle);
  // Door window
  const windowMat = new THREE.MeshPhysicalMaterial({
    color: 0x58a6ff, transparent: true, opacity: 0.2, roughness: 0.1, metalness: 0.1,
  });
  const win = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.4), windowMat);
  win.position.set(0, 0.7, 0.52);
  group.add(win);

  group.position.set(pos[0], pos[1], pos[2]);
  return group;
}

function buildRobot(pos, data) {
  const group = new THREE.Group();
  // Base
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.6, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x2d333b, roughness: 0.5, metalness: 0.3 })
  );
  base.position.y = 0.1;
  base.castShadow = true;
  group.add(base);
  // Turret
  const turret = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.4, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x58a6ff, roughness: 0.4, metalness: 0.6 })
  );
  turret.position.y = 0.35;
  group.add(turret);
  // Arm segments
  const armMat = new THREE.MeshStandardMaterial({ color: 0x7ee787, roughness: 0.4, metalness: 0.5 });
  const s1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), armMat);
  s1.position.set(0, 0.8, 0);
  group.add(s1);
  const s2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), armMat);
  s2.position.set(0.3, 1.1, 0);
  group.add(s2);
  // Gripper
  const gripMat = new THREE.MeshStandardMaterial({ color: 0xf0883e, roughness: 0.5, metalness: 0.4 });
  const g1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.08), gripMat);
  g1.position.set(0.55, 1.05, 0.06);
  group.add(g1);
  const g2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.08), gripMat);
  g2.position.set(0.55, 1.05, -0.06);
  group.add(g2);

  group.position.set(pos[0], pos[1], pos[2]);
  return group;
}

function buildConveyor(pos, data) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x3d444d, roughness: 0.7, metalness: 0.2 });
  const belt = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.5), mat);
  belt.position.y = 0.06;
  belt.castShadow = true;
  group.add(belt);
  // Rollers
  const rollerMat = new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.4, metalness: 0.7 });
  for (let x = -0.7; x <= 0.7; x += 0.7) {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5), rollerMat);
    r.rotation.x = Math.PI / 2;
    r.position.set(x, 0.06, 0);
    group.add(r);
  }
  group.position.set(pos[0], pos[1], pos[2]);
  return group;
}

function buildForklift(pos, data) {
  const group = new THREE.Group();
  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.3, 0.5),
    new THREE.MeshStandardMaterial({ color: 0xd29922, roughness: 0.5, metalness: 0.4 })
  );
  body.position.y = 0.15;
  body.castShadow = true;
  group.add(body);
  // Cabin
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.25, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x2d333b, roughness: 0.5, metalness: 0.3 })
  );
  cabin.position.set(-0.1, 0.425, 0);
  group.add(cabin);
  // Mast
  const mast = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.5, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.4, metalness: 0.7 })
  );
  mast.position.set(0.35, 0.4, 0);
  group.add(mast);
  // Forks
  const forkMat = new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.4, metalness: 0.7 });
  for (let z = -0.12; z <= 0.12; z += 0.24) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.04), forkMat);
    f.position.set(0.5, 0.1, z);
    group.add(f);
  }
  // Wheels
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.9 });
  for (let x of [-0.25, 0.25]) {
    for (let z of [-0.28, 0.28]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.04), wheelMat);
      w.rotation.x = Math.PI / 2;
      w.position.set(x, 0.04, z);
      group.add(w);
    }
  }
  group.position.set(pos[0], pos[1], pos[2]);
  return group;
}

function buildInjector(pos, data) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x3d444d, roughness: 0.5, metalness: 0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 1.0), mat);
  body.position.y = 0.45;
  body.castShadow = true;
  group.add(body);
  // Hopper
  const hop = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.4, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.5, metalness: 0.5 })
  );
  hop.position.set(0, 1.05, 0.3);
  group.add(hop);
  // Nozzle
  const noz = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.12, 0.2),
    new THREE.MeshStandardMaterial({ color: 0xf0883e, roughness: 0.4, metalness: 0.6 })
  );
  noz.position.set(0, 0.1, -0.55);
  group.add(noz);
  group.position.set(pos[0], pos[1], pos[2]);
  return group;
}

function buildPress(pos, data) {
  const group = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x3d444d, roughness: 0.5, metalness: 0.4 });
  // Frame
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.8), frameMat);
  frame.position.y = 0.6;
  frame.castShadow = true;
  group.add(frame);
  // Ram
  const ram = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.25, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.3, metalness: 0.7 })
  );
  ram.position.set(0, 0.25, 0);
  group.add(ram);
  // Anvil
  const anvil = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.08, 0.4),
    new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.4, metalness: 0.7 })
  );
  anvil.position.set(0, 0.04, 0);
  group.add(anvil);
  group.position.set(pos[0], pos[1], pos[2]);
  return group;
}

function buildWelder(pos, data) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x3d444d, roughness: 0.5, metalness: 0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.8), mat);
  body.position.y = 0.3;
  body.castShadow = true;
  group.add(body);
  // Arm
  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.4, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.4, metalness: 0.7 })
  );
  arm.position.set(0.4, 0.7, 0);
  group.add(arm);
  // Torch
  const torch = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.06, 0.15),
    new THREE.MeshStandardMaterial({ color: 0xf0883e, roughness: 0.5, metalness: 0.5 })
  );
  torch.position.set(0.55, 0.5, 0);
  group.add(torch);
  group.position.set(pos[0], pos[1], pos[2]);
  return group;
}

// ─── Assemble Machines ───────────────────────────────────────────────────────

const builders = {
  cnc:       buildCNC,
  robot:     buildRobot,
  conveyor:  buildConveyor,
  forklift:  buildForklift,
  injector:  buildInjector,
  press:     buildPress,
  welder:    buildWelder,
};

const machineObjects = [];

MACHINES.forEach((data) => {
  const group = builders[data.type](data.pos, data);
  group.userData = { ...data };
  scene.add(group);
  machineObjects.push(group);

  // Status ring
  const ringGeo = new THREE.RingGeometry(0.5, 0.55, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: data.status === 'online' ? 0x3fb950 : data.status === 'alert' ? 0xd29922 : 0xf85149,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.6,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(data.pos[0], 0.01, data.pos[2]);
  scene.add(ring);
  group.userData.ring = ring;

  // Label
  const label = createLabel(data.name);
  label.position.set(data.pos[0], 1.8, data.pos[2]);
  scene.add(label);
  group.userData.label = label;

  // Clickable area (invisible box)
  const hit = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 1.4, 1.2),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  hit.position.set(data.pos[0], 0.7, data.pos[2]);
  hit.userData.machineId = data.id;
  scene.add(hit);
  group.userData.hit = hit;
});

// ─── Forklift Animation Paths ────────────────────────────────────────────────

const forkliftPaths = {
  'FKL-001': { t: 0, speed: 0.002, points: [
    [-5, 0, 6], [-5, 0, 3], [-5, 0, 0], [-5, 0, -3], [-5, 0, 0], [-5, 0, 3], [-5, 0, 6],
  ]},
  'FKL-002': { t: 0, speed: 0.0025, points: [
    [3, 0, 6], [3, 0, 2], [3, 0, -2], [3, 0, 2], [3, 0, 6],
  ]},
  'FKL-003': { t: 0, speed: 0.0018, points: [
    [7, 0, 6], [7, 0, 4], [5, 0, 4], [3, 0, 4], [5, 0, 4], [7, 0, 4], [7, 0, 6],
  ]},
};

// ─── Raycaster ───────────────────────────────────────────────────────────────

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let selectedId = null;

renderer.domElement.addEventListener('click', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(
    machineObjects.map(m => m.userData.hit).filter(Boolean)
  );
  if (hits.length > 0) {
    const id = hits[0].object.userData.machineId;
    showPanel(id);
  }
});

// ─── Panel Logic ─────────────────────────────────────────────────────────────

const panel = document.getElementById('info-panel');
const panelName = document.getElementById('panel-name');
const panelStatus = document.getElementById('panel-status');
const panelTemp = document.getElementById('panel-temp');
const panelVib = document.getElementById('panel-vib');
const panelUsage = document.getElementById('panel-usage');
const cmdSelect = document.getElementById('cmd-select');
const cmdSend = document.getElementById('cmd-send');
const panelClose = document.getElementById('panel-close');
const toast = document.getElementById('toast');

function showPanel(id) {
  const m = MACHINES.find(x => x.id === id);
  if (!m) return;
  selectedId = id;
  panelName.textContent = `${m.id} — ${m.name}`;
  panelStatus.textContent = m.status === 'online' ? 'Online' : m.status === 'alert' ? 'Alerta' : 'Offline';
  panelStatus.className = 'status-badge ' + m.status;
  panelTemp.textContent = m.temp + ' °C';
  panelVib.textContent = m.vib.toFixed(1) + ' mm/s';
  panelUsage.textContent = m.usage + ' %';
  cmdSelect.value = '';
  panel.classList.add('visible');
}

function hidePanel() {
  panel.classList.remove('visible');
  selectedId = null;
}

panelClose.addEventListener('click', hidePanel);

cmdSend.addEventListener('click', () => {
  const cmd = cmdSelect.value;
  if (!cmd || !selectedId) return;
  const m = MACHINES.find(x => x.id === selectedId);
  showToast(`✅ Comando "${cmd}" enviado para ${m.id} — ${m.name}`);
  cmdSelect.value = '';
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// ─── HUD Stats ───────────────────────────────────────────────────────────────

function updateStats() {
  const online = MACHINES.filter(m => m.status === 'online').length;
  const alert = MACHINES.filter(m => m.status === 'alert').length;
  const offline = MACHINES.filter(m => m.status === 'offline').length;
  document.getElementById('stat-online').textContent = online;
  document.getElementById('stat-alert').textContent = alert;
  document.getElementById('stat-offline').textContent = offline;
}
updateStats();

// ─── Animation Loop ──────────────────────────────────────────────────────────

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Move forklifts
  MACHINES.forEach((data) => {
    if (!data.moving) return;
    const path = forkliftPaths[data.id];
    if (!path) return;
    path.t = (path.t + path.speed * dt * 60) % 1;
    const idx = Math.floor(path.t * (path.points.length - 1));
    const frac = (path.t * (path.points.length - 1)) - idx;
    const i0 = Math.min(idx, path.points.length - 2);
    const i1 = i0 + 1;
    const p0 = path.points[i0];
    const p1 = path.points[i1];
    const obj = machineObjects.find(o => o.userData.id === data.id);
    if (obj) {
      const x = p0[0] + (p1[0] - p0[0]) * frac;
      const z = p0[2] + (p1[2] - p0[2]) * frac;
      obj.position.x = x;
      obj.position.z = z;
      // Update ring & label
      if (obj.userData.ring) {
        obj.userData.ring.position.x = x;
        obj.userData.ring.position.z = z;
      }
      if (obj.userData.label) {
        obj.userData.label.position.x = x;
        obj.userData.label.position.z = z;
      }
      if (obj.userData.hit) {
        obj.userData.hit.position.x = x;
        obj.userData.hit.position.z = z;
      }
    }
  });

  // Robot arm animation (subtle rotation)
  machineObjects.forEach((obj) => {
    if (obj.userData.type === 'robot' && obj.userData.status === 'online') {
      obj.rotation.y += dt * 0.3;
    }
  });

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

animate();

// ─── Resize ──────────────────────────────────────────────────────────────────

window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});

console.log('🏭 IoT Factory Dashboard loaded —', MACHINES.length, 'machines');
</script>
